      },
      {
        test: /物料|领取|步骤|流程/,
        answer: '领取物料需先登记并完成门店确认，批量需求需预留申请时间。',
        sources: [
          {
            title: '市场部工作指南.docx · V3 · 2.3 物料领用与登记',
            type: 'Word',
            icon: 'lucide:file-text',
            date: '2026-10-20 09:00 生效'
          },
          {
            title: '物料领用规范.pdf · V2 · 第 3 页',
            type: 'PDF',
            icon: 'lucide:file-type-2',
            date: '2026-09-15 14:00 生效'
          }
        ]
      }
    ];

    const fallbackResponse = {
      answer: '当前已发布资料中暂未找到与该问题完全匹配的内容。你可以补充具体门店、物品名称或流程环节后再试。',
      sources: [
        {
          title: '市场部知识库资料范围说明.pdf',
          type: 'PDF',
          icon: 'lucide:file-text',
          date: '2026-10-01 生效'
        }
      ]
    };

    function updateSendState() {
      sendButton.disabled = questionInput.value.trim().length === 0;
    }

    function resizeInput() {
      questionInput.style.height = 'auto';
      const height = Math.min(questionInput.scrollHeight, 128);
      questionInput.style.height = Math.max(height, 44) + 'px';
    }

    function showWelcome() {
      welcome.classList.remove('hidden');
      welcome.classList.add('flex');
    }

    function hideWelcome() {
      welcome.classList.add('hidden');
      welcome.classList.remove('flex');
    }

    function createSourceCard(source) {
      const fragment = sourceTemplate.content.cloneNode(true);
      const icon = fragment.querySelector('[data-source-icon]');
      icon.setAttribute('icon', source.icon);
      fragment.querySelector('[data-source-title]').textContent = source.title;
      fragment.querySelector('[data-source-type]').textContent = source.type;
      fragment.querySelector('[data-source-date]').textContent = source.date;
      return fragment;
    }

    function appendExchange(question) {
      const sessionByQuestion = /联系人|店长|对接人|电话/.test(question) ? 'contacts'
        : (/物料|领取|步骤|流程/.test(question) ? 'materials' : 'poster');
      const userFragment = userMessageTemplate.content.cloneNode(true);
      userFragment.querySelector('[data-question]').textContent = question;
      conversation.appendChild(userFragment);

      const response = responses.find(item => item.test.test(question)) || fallbackResponse;
      const searching = document.createElement('div');
      searching.className = 'flex items-start gap-3.5';
      searching.innerHTML = '<div class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-blue-600 text-white shadow-sm"><iconify-icon icon="lucide:sparkles" class="text-[15px]" aria-hidden="true"></iconify-icon></div>' +
        '<div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="text-[13px] font-semibold text-slate-900">知识库回答</span><span class="text-[11px] text-slate-400">刚刚</span></div>' +
        '<div class="mt-2 flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3.5 py-3 shadow-sm">' +
        '<span class="flex h-5 w-5 shrink-0 animate-spin items-center justify-center rounded-full border-2 border-blue-200 border-t-blue-600"></span>' +
        '<span class="text-[13px] text-slate-600">正在查找资料…</span></div></div>';
      conversation.appendChild(searching);

      hideWelcome();
      conversation.classList.remove('hidden');
      threadState.textContent = '正在查找资料…';
      requestAnimationFrame(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      });

      setTimeout(() => {
        searching.remove();
        const answerFragment = answerTemplate.content.cloneNode(true);
        answerFragment.querySelector('[data-answer-body]').textContent = response.answer;
        const sourceContainer = answerFragment.querySelector('[data-sources]');
        response.sources.forEach(source => {
          sourceContainer.appendChild(createSourceCard(source));
        });
        conversation.appendChild(answerFragment);
        const actions = document.getElementById('answerActions');
        if (actions) {
          actions.querySelectorAll('a').forEach(link => {
            link.setAttribute('href', 'session.html?session=' + sessionByQuestion);
          });
          actions.classList.remove('hidden');
        }
        threadState.textContent = '对话中';
        requestAnimationFrame(() => {
          chatScroll.scrollTop = chatScroll.scrollHeight;
        });
      }, 1200);
    }

    function submitQuestion(event) {
      if (event) {
        event.preventDefault();
      }
      const question = questionInput.value.trim();
      if (!question) {
        return;
      }
      appendExchange(question);
      questionInput.value = '';
      questionInput.style.height = '44px';
      updateSendState();
      questionInput.focus();
    }

    function startNewChat(event) {
      if (event) {
        event.preventDefault();
      }
      conversation.innerHTML = '';
      conversation.classList.add('hidden');
      document.getElementById('answerActions').classList.add('hidden');
      showWelcome();
      questionInput.value = '';
      questionInput.style.height = '44px';
      updateSendState();
      threadState.textContent = '新对话';
      chatScroll.scrollTop = 0;
      questionInput.focus();
    }

    questionInput.addEventListener('input', () => {
      resizeInput();
      updateSendState();
    });

    questionInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        submitQuestion();
      }
    });

    askForm.addEventListener('submit', submitQuestion);
    newChatLink.addEventListener('click', startNewChat);

    document.querySelectorAll('[data-question]').forEach(button => {
      button.addEventListener('click', () => {
        questionInput.value = button.dataset.question || '';
        resizeInput();
        updateSendState();
        questionInput.focus();
      });
    });

    updateSendState();

    const logoutModal = document.getElementById('logoutModal');
    const logoutButton = document.getElementById('logoutButton');
    const cancelLogout = document.getElementById('cancelLogout');
    const confirmLogout = document.getElementById('confirmLogout');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;
    let previousFocus = null;

    function openLogoutModal() {
      previousFocus = document.activeElement;
      logoutModal.classList.remove('hidden');
      logoutModal.classList.add('flex');
      cancelLogout.focus();
    }

    function closeLogoutModal() {
      logoutModal.classList.add('hidden');
      logoutModal.classList.remove('flex');
      if (previousFocus) {
        previousFocus.focus();
      }
    }

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2200);
    }

    logoutButton.addEventListener('click', openLogoutModal);
    cancelLogout.addEventListener('click', closeLogoutModal);
    confirmLogout.addEventListener('click', () => {
      closeLogoutModal();
      showToast('已退出登录');
    });
    logoutModal.addEventListener('click', event => {
      if (event.target === logoutModal) {
        closeLogoutModal();
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !logoutModal.classList.contains('hidden')) {
        closeLogoutModal();
      }
    });
  </script>
</body>
</html>
