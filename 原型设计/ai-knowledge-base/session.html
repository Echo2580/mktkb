    }

    function safeFact(text) {
      return (text || '').replace(/"/g, '&quot;');
    }

    function factSourceChip(key, fact, index) {
      const tag = typeof index === 'number' ? '<span class="mr-1.5 shrink-0 rounded bg-slate-100 px-1 py-0.5 text-[10px] font-medium text-slate-500">[' + (index + 1) + ']</span>' : '';
      return '<button type="button" data-open-source="' + key + '" data-source-name="' + sources[key].name + '" data-source-fact="' + safeFact(fact) + '" class="group flex w-full items-start gap-2 rounded-lg border border-slate-200 bg-slate-50/70 px-2.5 py-2 text-left transition hover:border-blue-200 hover:bg-blue-50/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">' +
        tag +
        '<iconify-icon icon="lucide:quote" class="mt-0.5 shrink-0 text-[12px] text-slate-400" aria-hidden="true"></iconify-icon>' +
        '<span class="min-w-0 flex-1 text-[12px] leading-5 text-slate-600">' + fact + '</span>' +
        '<iconify-icon icon="lucide:chevron-right" class="mt-0.5 shrink-0 text-[13px] text-slate-300 transition group-hover:text-blue-500" aria-hidden="true"></iconify-icon>' +
        '</button>';
    }

    function sourceBar(key, fact, index) {
      const source = sources[key];
      return '<div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-2.5 py-2">' +
        '<span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-slate-50 text-slate-500 ring-1 ring-slate-200">' +
        '<iconify-icon icon="' + source.icon + '" class="text-[14px]" aria-hidden="true"></iconify-icon></span>' +
        '<div class="min-w-0 flex-1">' +
        '<p class="truncate text-[12px] font-medium text-slate-800">' + (typeof index === 'number' ? '[' + (index + 1) + '] ' : '') + source.name + ' · ' + source.version + '</p>' +
        '<p class="mt-0.5 truncate text-[11px] text-slate-500">' + source.label + ' · 生效 ' + source.effective + '</p>' +
        '</div>' +
        '<button type="button" data-open-source="' + key + '" data-source-name="' + sources[key].name + '" data-source-fact="' + safeFact(fact) + '" class="inline-flex h-7 shrink-0 items-center gap-1 rounded-md border border-slate-200 bg-white px-2 text-[11px] font-medium text-slate-700 transition hover:border-blue-300 hover:text-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1">' +
        '<iconify-icon icon="lucide:scan-eye" class="text-[13px]" aria-hidden="true"></iconify-icon>查看依据</button>' +

    function userBubble(query) {
      return '<div class="flex flex-col items-end gap-1">' +
        '<div class="max-w-[78%] whitespace-pre-wrap rounded-2xl rounded-tr-md bg-blue-600 px-4 py-2.5 text-[14px] leading-6 text-white shadow-sm">' + query.text + '</div>' +
        '<div class="pr-1 text-[11px] text-slate-400">发送于 ' + query.time + '</div>' +

    function searchingBlock(time) {
      return '<div class="flex items-start gap-3.5" data-searching>' +

        '<div class="mt-2 flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3.5 py-3 shadow-sm">' +

    function answerBlock(answer, time) {
      const multi = answer.notes.length > 1;
      const fields = answer.fields.map(item =>
        '<div class="flex items-baseline gap-3 py-1.5">' +
        '<dt class="w-[88px] shrink-0 text-[12px] text-slate-500">' + item[0] + '</dt>' +
        '<dd class="min-w-0 flex-1 text-[12px] font-medium text-slate-800">' + item[1] + '</dd>' +
        '</div>'
      ).join('');
      const notes = answer.notes.map((note, index) => factSourceChip(note.source, note.text, multi ? index : undefined)).join('');
      const bars = answer.notes.map((note, index) => sourceBar(note.source, note.text, multi ? index : undefined)).join('');
      return '<div class="flex items-start gap-3.5" data-answer>' +
        avatar() +
        '<div class="min-w-0 flex-1">' +
        '<div class="flex flex-wrap items-center gap-x-2 gap-y-1">' +
        '<span class="text-[13px] font-semibold text-slate-900">知识库回答</span>' +
        '<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] font-medium text-emerald-700"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>基于已发布资料</span>' +
        moment(time) +
        '</div>' +
        '<div class="mt-2.5 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">' +
        '<p class="text-[15px] font-medium leading-7 text-slate-900">' + answer.body + '</p>' +
        '<dl class="mt-3 divide-y divide-slate-100 rounded-lg bg-slate-50/70 px-3 py-1">' + fields + '</dl>' +
        '<div class="mt-3.5 border-t border-slate-100 pt-3">' +
        '<p class="mb-2 text-[11px] text-slate-500">每条来源均为只读资料，版本与生效时间以左侧来源标识为准；发送时间与生效时间互不替代。</p>' +
        '<div class="mb-2 flex items-center justify-between gap-2">' +
        '<span class="flex items-center gap-1.5 text-[12px] font-semibold text-slate-700">' +
        '<iconify-icon icon="lucide:link-2" class="text-[13px] text-slate-400" aria-hidden="true"></iconify-icon>' +
        (multi ? '事实与来源对照' : '来源与依据') + '</span>' +
        '<span class="text-[11px] text-slate-400">' + (multi ? '每条事实单独标注来源' : '生效时间与发送时间分开显示') + '</span>' +

        '<div class="space-y-1.5">' + notes + '</div>' +
        '<div class="mt-2 space-y-1.5">' + bars + '</div>' +
        '</div></div></div></div>';

    function resolveResponse(question) {
      if (/负责人/.test(question)) return answers.q2;
      if (/联系人|电话/.test(question)) return {
        body: '合作店家信息表记录了城东店的联系人：模拟联系人·陈宁。',
        fields: [
          ['联系电话', '010-00000001（模拟）'],
          ['资料来源', '合作店家信息.xlsx']
        ],
        notes: [
          { text: '联系人为「模拟联系人·陈宁」，电话 010-00000001（模拟）', source: 'contactsXlsx' }
        ]
      };
      if (/流程|步骤|领取/.test(question)) return {
        body: '领取物料需先登记并完成门店确认，批量需求需预留申请时间。',
        fields: [
          ['适用环节', '活动物料领取'],
          ['申请时限', '批量物料提前 2 个工作日']
        ],
        notes: [
          { text: '物料领用需填写登记表并经门店负责人确认', source: 'docx' },
          { text: '批量物料建议至少提前 2 个工作日提交申请', source: 'pdf' }
        ]
      };
      return answers.q1;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      });
    }

    function appendFragment(html) {
      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      const node = wrap.firstElementChild;
      conversation.appendChild(node);
      scrollToBottom();
      return node;
    }

    function searchThenAnswer(question, typingTime, answerTime) {
      const searching = appendFragment(searchingBlock(typingTime));
      return new Promise(resolve => {
        setTimeout(() => {
          searching.remove();
          appendFragment(answerBlock(resolveResponse(question), answerTime));
          resolve();
        }, 1200);
      });
    }

    async function send(question) {
      const text = question.trim();
      if (!text || sendButton.disabled) return;
      sendButton.disabled = true;
      replayButton.disabled = true;
      questionInput.value = '';
      threadState.textContent = '正在查找资料…';
      appendFragment(userBubble({ text: text, time: '刚刚' }));
      await searchThenAnswer(text, '检索中', '刚刚');
      threadState.textContent = '已结束 · 可继续追问';
      replayButton.disabled = false;
      questionInput.focus();
    }

    async function replay() {
      replayButton.disabled = true;
      followups.classList.add('opacity-50');
      conversation.innerHTML = '';
      sendButton.disabled = true;
      threadState.textContent = '正在查找资料…';
      appendFragment(userBubble(queries.q1));
      await searchThenAnswer(queries.q1.text, typingTimes.q1, answerTimes.q1);
      appendFragment(userBubble(queries.q2));
      await searchThenAnswer(queries.q2.text, typingTimes.q2, answerTimes.q2);
      followups.classList.remove('opacity-50');
      threadState.textContent = '已结束 · 可继续追问';
      replayButton.disabled = false;
    }

        '<div class="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-3">' +
        '<div class="flex items-center justify-between gap-2 pb-2 text-[11px] text-slate-500">' +
        '<span class="flex items-center gap-1.5"><iconify-icon icon="lucide:image" class="text-[12px]" aria-hidden="true"></iconify-icon>原图</span>' +
        '<span class="rounded bg-white px-1.5 py-0.5 ring-1 ring-slate-200">1920 × 1280</span></div>' +
        '<div class="flex h-[168px] flex-col justify-between overflow-hidden rounded-md bg-gradient-to-br from-slate-200 via-slate-100 to-slate-200 p-3 ring-1 ring-slate-200">' +
        '<div class="flex items-start justify-between">' +
        '<span class="rounded bg-slate-900/70 px-1.5 py-0.5 text-[10px] font-medium text-white">B区1号货架</span>' +
        '<iconify-icon icon="lucide:image" class="text-[14px] text-slate-400" aria-hidden="true"></iconify-icon>' +
        '</div>' +
        '<div class="space-y-1.5">' +
        '<div class="h-3 w-2/3 rounded bg-white/80 ring-1 ring-slate-300"></div>' +
        '<div class="flex gap-1.5"><div class="h-3 w-16 rounded bg-amber-200/90 ring-1 ring-amber-300"></div><div class="h-3 w-24 rounded bg-white/70 ring-1 ring-slate-300"></div></div>' +
        '<div class="h-3 w-1/2 rounded bg-white/60 ring-1 ring-slate-300"></div>' +
        '</div>' +
        '<span class="self-start rounded bg-white/85 px-1.5 py-0.5 text-[10px] text-slate-600 ring-1 ring-slate-200">第二层 · 宣传海报</span>' +
        '</div></div>' +
        '<div class="mt-3 overflow-hidden rounded-lg border border-slate-200">' +
        '<div class="flex items-center justify-between border-b border-slate-100 bg-slate-50 px-3 py-2">' +
        '<span class="flex items-center gap-1.5 text-[12px] font-medium text-slate-700">' +
        '<iconify-icon icon="lucide:scan-text" class="text-[13px] text-slate-500" aria-hidden="true"></iconify-icon>识别文本</span>' +
        '<span class="rounded bg-white px-1.5 py-0.5 text-[10px] text-slate-500 ring-1 ring-slate-200">只读</span></div>' +
        '<div class="space-y-1.5 px-3 py-2.5 text-[12px] leading-5 text-slate-700">' +
        '<p>货架：B区1号</p>' +
        '<p>层位：第二层</p>' +
        '<p class="rounded bg-amber-50 px-1.5 py-0.5 ring-1 ring-inset ring-amber-200">标签：宣传海报</p>' +
        '<p class="text-[11px] text-slate-500">无负责人信息</p>' +
        '</div></div>';
    }

    const views = { excel: excelView, word: wordView, pdf: pdfView, image: imageView };

    function selectTab(key) {
      drawerTabs.querySelectorAll('[data-tab]').forEach(tab => {
        const active = tab.dataset.tab === key;
        tab.setAttribute('aria-selected', String(active));
        tab.classList.toggle('bg-white', active);
        tab.classList.toggle('shadow-sm', active);
        tab.classList.toggle('text-slate-800', active);
        tab.classList.toggle('text-slate-500', !active);
      });
      const source = sources[key];
      drawerSubtitle.textContent = source.name + ' · ' + source.version;
      drawerBody.innerHTML = views[key](source, currentFact);
      const zoom = document.getElementById('pdfZoom');
      if (zoom) {
        zoom.addEventListener('click', () => {
          const page = document.getElementById('pdfPage');
          const note = document.getElementById('pdfZoomNote');
          const on = !page.classList.contains('scale-[1.1]');
          page.classList.toggle('scale-[1.1]', on);
          page.classList.toggle('origin-top', on);
          note.classList.toggle('hidden', !on);
          zoom.setAttribute('aria-pressed', String(on));
          zoom.innerHTML = on
            ? '<iconify-icon icon="lucide:zoom-out" class="text-[13px]" aria-hidden="true"></iconify-icon>恢复比例'
            : '<iconify-icon icon="lucide:zoom-in" class="text-[13px]" aria-hidden="true"></iconify-icon>放大核对';
        });
      }
      drawerBody.scrollTop = 0;
    }

    function openDrawer(key, fact, trigger) {
      currentFact = fact || sources[key].fact;
      lastTrigger = trigger || null;
      selectTab(key);
      drawer.classList.remove('translate-x-full');
      drawerScrim.classList.remove('opacity-0', 'pointer-events-none');
      drawer.focus();
    }

    function closeDrawer() {
      drawer.classList.add('translate-x-full');
      drawerScrim.classList.add('opacity-0', 'pointer-events-none');
      if (lastTrigger && document.body.contains(lastTrigger)) {
        lastTrigger.focus();
      } else {
        questionInput.focus();
      }
    }

    conversation.addEventListener('click', event => {
      const button = event.target.closest('[data-open-source]');
      if (!button) return;
      openDrawer(button.dataset.openSource, button.dataset.sourceFact, button);
    });
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerFootClose').addEventListener('click', closeDrawer);
    drawerBack.addEventListener('click', closeDrawer);
    drawerScrim.addEventListener('click', closeDrawer);
    drawerTabs.addEventListener('click', event => {
      const tab = event.target.closest('[data-tab]');
      if (tab) selectTab(tab.dataset.tab);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !drawer.classList.contains('translate-x-full')) {
        closeDrawer();
      }
    });

    questionInput.addEventListener('input', () => {
      sendButton.disabled = questionInput.value.trim().length === 0;
    });
    questionInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        send(questionInput.value);
      }
    });
    sendButton.addEventListener('click', () => send(questionInput.value));
    followups.addEventListener('click', event => {
      const chip = event.target.closest('[data-followup]');
      if (!chip) return;
      questionInput.value = chip.dataset.followup;
      send(chip.dataset.followup);
    });
    replayButton.addEventListener('click', replay);

    function fitLayout() {
      const wide = window.innerWidth >= 1320;
      drawer.classList.toggle('w-full', !wide);
      if (wide) {
        drawer.classList.add('w-[480px]');
      } else {
        drawer.classList.remove('w-[480px]');
      }
      drawerBack.classList.toggle('hidden', wide);
      drawerBack.classList.toggle('flex', !wide);
      replayButton.classList.toggle('hidden', !wide);
    }
    window.addEventListener('resize', fitLayout);
    fitLayout();

    document.querySelectorAll('[data-session]').forEach(link => {
      if (link.dataset.session !== 'poster') return;
      const icon = link.querySelector('iconify-icon');
      link.classList.add('bg-slate-100', 'text-slate-900', 'font-medium');
      link.classList.remove('text-slate-600');
      link.setAttribute('aria-current', 'page');
      if (icon) {
        icon.classList.add('text-blue-600');
        icon.classList.remove('text-slate-400', 'group-hover:text-slate-500');
      }
    });

    replay();

    const logoutModal = document.getElementById('logoutModal');
    const logoutButton = document.getElementById('logoutButton');
    const cancelLogout = document.getElementById('cancelLogout');
    const confirmLogout = document.getElementById('confirmLogout');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;
    let previousFocus = null;

    function openLogoutModal() {
      previousFocus = document.activeElement;
      logoutModal.classList.remove('hidden');
      logoutModal.classList.add('flex');
      cancelLogout.focus();
    }

    function closeLogoutModal() {
      logoutModal.classList.add('hidden');
      logoutModal.classList.remove('flex');
      if (previousFocus) {
        previousFocus.focus();
      }
    }

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2200);
    }

    logoutButton.addEventListener('click', openLogoutModal);
    cancelLogout.addEventListener('click', closeLogoutModal);
    confirmLogout.addEventListener('click', () => {
      closeLogoutModal();
      showToast('已退出登录');
    });
    logoutModal.addEventListener('click', event => {
      if (event.target === logoutModal) {
        closeLogoutModal();
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !logoutModal.classList.contains('hidden')) {
        closeLogoutModal();
      }
    });
  </script>
</body>
</html>
